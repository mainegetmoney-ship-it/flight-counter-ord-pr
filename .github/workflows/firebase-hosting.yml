name: Firebase Hosting Preview

on:
  push:
    branches:
      - 'chatgpt/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate application JavaScript
        run: node --check public/app.js

      - name: Deploy Firebase Hosting preview
        id: firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORD_PR_FLIGHT_COUNTER }}'
          projectId: ord-pr-flight-counter
          channelId: chatgpt-routes
          expires: 7d

      - name: Record preview URL
        run: |
          echo "### Firebase Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.firebase.outputs.details_url }}" >> "$GITHUB_STEP_SUMMARY"
